<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sukuna X Master AI</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#06080c;--bg2:#090d14;--bg3:#0d1420;--bg4:#121a28;
  --bdr:#192030;--bdr2:#1f2d42;
  --a:#00ff88;--a2:#00ccff;--a3:#ff4466;--a4:#ffaa00;--a5:#cc44ff;--a6:#ff6600;
  --tx:#cce0f0;--tx2:#6a8aa8;--tx3:#2e4460;
  --ubg:#0a1d32;--aibg:#080e18;
  --radius:12px;--sb-w:280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Cairo',sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}

/* LIGHT THEME */
body.light{--bg:#f0f4f8;--bg2:#e8edf3;--bg3:#dde4ed;--bg4:#d0daea;--bdr:#c0cdd8;--bdr2:#b0c0d0;--tx:#1a2535;--tx2:#4a6080;--tx3:#8090a8;--ubg:#d8e8f8;--aibg:#e4ecf4}

/* PARTICLES */
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:float linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.5}90%{opacity:.15}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* GRID BG */
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.01) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}

/* REGISTRATION */
#reg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#0a1020,#030507);z-index:8000;display:flex;align-items:center;justify-content:center;padding:16px}
.rbox{background:rgba(9,13,20,.97);border:1px solid var(--bdr2);border-radius:24px;padding:28px 22px;width:100%;max-width:400px;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,255,136,.05),0 40px 80px rgba(0,0,0,.9)}
.rbox::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--a),var(--a2),var(--a5),transparent)}
.r-orb{width:66px;height:66px;margin:0 auto 12px;position:relative;display:flex;align-items:center;justify-content:center}
.r-orb-inner{width:56px;height:56px;background:linear-gradient(135deg,rgba(0,255,136,.2),rgba(0,204,255,.1),rgba(204,68,255,.15));border:1px solid rgba(0,255,136,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--a);box-shadow:0 0 30px rgba(0,255,136,.2)}
.r-logo{text-align:center;margin-bottom:20px}
.r-title{font-size:21px;font-weight:900;background:linear-gradient(135deg,var(--a),var(--a2),var(--a5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px}
.r-sub{font-size:9px;color:var(--tx3);font-family:'Share Tech Mono',monospace;letter-spacing:2px}
.r-field{margin-bottom:11px}
.r-lbl{display:block;font-size:9px;color:var(--a);text-transform:uppercase;letter-spacing:1.5px;font-family:'Share Tech Mono',monospace;margin-bottom:5px;opacity:.7}
.r-inp{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--bdr2);border-radius:10px;padding:11px 14px;color:var(--tx);font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:all .2s}
.r-inp:focus{border-color:rgba(0,255,136,.4);box-shadow:0 0 16px rgba(0,255,136,.07)}
.r-inp::placeholder{color:var(--tx3)}
.r-btn{width:100%;padding:13px;background:linear-gradient(135deg,#00d070,#00b0f0);border:none;border-radius:11px;color:#040d08;font-size:15px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .25s;margin-top:4px;box-shadow:0 4px 20px rgba(0,255,136,.2)}
.r-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,255,136,.35)}
.r-btn:active{transform:translateY(0)}
.r-err{color:var(--a3);font-size:11px;margin-top:5px;text-align:center;font-family:'Share Tech Mono',monospace;min-height:16px}

/* APP PANEL */
#app{display:flex;height:100vh;opacity:0;transition:opacity .5s;position:relative;z-index:1}
#app.show{opacity:1}

/* SIDEBAR */
.sb{width:var(--sb-w);flex-shrink:0;height:100vh;background:var(--bg2);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:300}
.sb-logo{padding:11px 13px 9px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sb-logo-row{display:flex;align-items:center;gap:9px}
.sb-emb{width:32px;height:32px;background:linear-gradient(135deg,rgba(0,255,136,.2),rgba(0,204,255,.15));border:1px solid rgba(0,255,136,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--a);flex-shrink:0}
.sb-name{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--a);letter-spacing:2px}
.sb-sub{font-size:7px;color:var(--tx3);letter-spacing:1.5px;font-family:'Share Tech Mono',monospace}

.ubadge{margin:7px 10px 5px;padding:6px 9px;background:var(--bg3);border:1px solid var(--bdr);border-radius:9px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.uname-t{font-size:11px;color:var(--tx);font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uout{font-size:12px;cursor:pointer;color:var(--tx3);transition:color .2s;flex-shrink:0}
.uout:hover{color:var(--a3)}

.sb-status{display:flex;gap:5px;padding:4px 11px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sdot{display:flex;align-items:center;gap:3px;font-size:7px;color:var(--tx3);font-family:'Share Tech Mono',monospace}
.d{width:5px;height:5px;border-radius:50%}
.d.g{background:var(--a)}

.sb-tabs{display:flex;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sb-tab{flex:1;padding:7px 4px;font-size:9px;color:var(--tx3);cursor:pointer;text-align:center;font-family:'Share Tech Mono',monospace}
.sb-tab.active{color:var(--a);border-bottom:2px solid var(--a);background:rgba(0,255,136,.04)}
.sb-tab i{display:block;font-size:12px;margin-bottom:2px}

.sb-panel{display:none;flex:1;overflow-y:auto;padding:10px}
.sb-panel.active{display:flex;flex-direction:column}
.sb-sec{margin-bottom:12px}
.sb-sec-t{font-size:9px;color:var(--tx3);margin-bottom:6px;font-family:'Share Tech Mono',monospace}

.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.mood-btn{padding:5px 2px;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;font-size:9px;cursor:pointer;text-align:center;color:var(--tx3)}
.mood-btn.active{background:rgba(0,255,136,.1);border-color:var(--a);color:var(--a)}

.qcmd{padding:6px;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;font-size:10px;color:var(--tx2);cursor:pointer;margin-bottom:4px}

/* MAIN CHAT AREA */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;min-width:0}
.ch{background:rgba(9,13,20,.97);border-bottom:1px solid var(--bdr);padding:10px;display:flex;align-items:center;justify-content:between;flex-shrink:0}
.ch-title{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--a2)}

.msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px}
.wel{text-align:center;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.wel-title{font-size:20px;font-weight:900;color:var(--a)}

.mrow{display:flex;gap:8px}
.mrow.user{flex-direction:row-reverse}
.mav{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.mav.ai{background:rgba(0,255,136,.1);color:var(--a)}
.mav.user{background:rgba(0,204,255,.1);color:var(--a2)}
.mcont{max-width:75%}
.mname{font-size:9px;color:var(--tx3);margin-bottom:2px}
.mbub{padding:10px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.mrow.ai .mbub{background:var(--aibg);border:1px solid var(--bdr)}
.mrow.user .mbub{background:var(--ubg)}

/* BOTTOM INPUT */
.inp-area{position:fixed;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(to top,var(--bg) 85%,transparent);z-index:7000}
.inp-w{max-width:800px;margin:0 auto;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--radius);display:flex;align-items:center;padding:6px 10px}
#msg-inp{flex:1;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:14px;resize:none;max-height:120px;outline:none}
.ibtn{background:transparent;border:none;color:var(--tx2);font-size:16px;cursor:pointer;padding:6px}
.ibtn.send{color:var(--a2)}

/* TYPING INDICATOR */
.typ-ind{display:flex;gap:4px;padding:8px;background:var(--aibg);border-radius:8px;width:fit-content}
.td{width:6px;height:6px;background:var(--a);border-radius:50%;animation:ta 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}
.td:nth-child(3){animation-delay:.4s}
@keyframes ta{0%,100%{transform:translateY(0);opacity:0.3}50%{transform:translateY(-4px);opacity:1}}
</style>
</head>
<body>

<div id="particles"></div>

<div id="reg">
  <div class="rbox">
    <div class="r-orb"><div class="r-orb-inner"><i class="fa-solid fa-terminal"></i></div></div>
    <div class="r-logo">
      <div class="r-title">SUKUNA X MASTER AI</div>
      <div class="r-sub">STABLE INTELLIGENCE FRAMEWORK</div>
    </div>
    <div class="r-field">
      <label class="r-lbl">اسم المستخدم</label>
      <input type="text" id="reg-user" class="r-inp" placeholder="اكتب اسمك هنا...">
    </div>
    <button class="r-btn" onclick="tryRegister()">دخول النظام</button>
    <div id="reg-err" class="r-err"></div>
  </div>
</div>

<div id="app">
  <div class="sb" id="sb">
    <div class="sb-logo">
      <div class="sb-logo-row">
        <div class="sb-emb"><i class="fa-solid fa-brain"></i></div>
        <div>
          <div class="sb-name">SUKUNA MASTER</div>
          <div class="sb-sub">INTELLIGENCE NODE</div>
        </div>
      </div>
    </div>

    <div class="ubadge">
      <div class="uname-t" id="lbl-username">المستخدم</div>
      <i class="fa-solid fa-right-from-bracket uout" onclick="logout()"></i>
    </div>

    <div class="sb-status">
      <div class="sdot"><div class="d g"></div>ONLINE</div>
    </div>

    <div class="sb-tabs">
      <div class="sb-tab active" onclick="setTab('chat')"><i class="fa-solid fa-message"></i>المساعد</div>
    </div>

    <div class="sb-panel active" id="p-chat">
      <div class="sb-sec">
        <div class="sb-sec-t">توجيه المود</div>
        <div class="mood-grid">
          <div class="mood-btn active" id="m-gen" onclick="setMood('gen')">عام</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="ch">
      <div class="ch-title">SUKUNA_CORE_NODE:~#</div>
    </div>

    <div class="msgs" id="chat-screen">
      <div class="wel" id="welcome-block">
        <div class="wel-title">مرحباً بك في واجهة محادثة Gemini AI</div>
        <div class="wel-sub">اكتب استفساراتك البرمجية أو التقنية في الصندوق بالأسفل للحصول على إجابات مباشرة.</div>
      </div>
    </div>

    <div class="inp-area" id="input-area">
      <div class="inp-w">
        <textarea id="msg-inp" placeholder="اكتب رسالتك هنا للـ AI..." rows="1" oninput="autoGrow(this)" onkeydown="checkSend(event)"></textarea>
        <button class="ibtn send" onclick="sendMsg()" title="إرسال">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
let currentUsername = 'المستخدم';

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

function checkSend(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
}

function tryRegister() {
  const u = document.getElementById('reg-user').value.trim();
  if(!u) {
    document.getElementById('reg-err').innerText = "الرجاء إدخال اسم المستخدم";
    return;
  }
  currentUsername = u;
  document.getElementById('lbl-username').innerText = u;
  document.getElementById('reg').style.display = 'none';
  document.getElementById('app').classList.add('show');
}

// دالة الربط وإرسال طلب إلى معالج ذكاء Gemini الاصطناعي الفعلي
async function sendMsg() {
  const inp = document.getElementById('msg-inp');
  const text = inp.value.trim();
  if(!text) return;
  
  document.getElementById('welcome-block').style.display = 'none';
  appendRenderedMessage(text, 'user');
  inp.value = '';
  inp.style.height = "auto";
  
  showTypingIndicator();

  // استخدام الـ API Key الخاص بك للاتصال بخوادم جوجل جينيريتف المباشرة
  const apiKey = "AIzaSyCNJIRdT9tcWPG7q_0Wx0t9G49KGziE2vI";
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: text }] }]
      })
    });

    const data = await response.json();
    hideTypingIndicator();

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      const aiResponse = data.candidates[0].content.parts[0].text;
      appendRenderedMessage(aiResponse, 'ai');
    } else {
      appendRenderedMessage("عذراً، لم أتمكن من معالجة الرد بشكل صحيح.", 'ai');
    }
  } catch (error) {
    hideTypingIndicator();
    console.error(error);
    appendRenderedMessage("حدث خطأ في الاتصال بالسيرفر، يرجى التحقق من الشبكة.", 'ai');
  }
}

function appendRenderedMessage(text, sender) {
  const screen = document.getElementById('chat-screen');
  const row = document.createElement('div');
  row.className = 'mrow ' + sender;
  
  const mav = document.createElement('div');
  mav.className = 'mav ' + sender;
  mav.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
  
  const cont = document.createElement('div');
  cont.className = 'mcont';
  
  const name = document.createElement('div');
  name.className = 'mname';
  name.innerText = sender === 'user' ? currentUsername : 'SUKUNA AI';
  
  const bub = document.createElement('div');
  bub.className = 'mbub';
  bub.innerText = text;
  
  cont.appendChild(name);
  cont.appendChild(bub);
  row.appendChild(mav);
  row.appendChild(cont);
  screen.appendChild(row);
  
  screen.scrollTop = screen.scrollHeight;
}

function showTypingIndicator() {
  const screen = document.getElementById('chat-screen');
  const ind = document.createElement('div');
  ind.className = 'mrow ai';
  ind.id = 'typing-indicator';
  ind.innerHTML = '<div class="mav ai"><i class="fa-solid fa-ellipsis"></i></div><div class="mcont"><div class="typ-ind"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>';
  screen.appendChild(ind);
  screen.scrollTop = screen.scrollHeight;
}

function hideTypingIndicator() {
  const ind = document.getElementById('typing-indicator');
  if(ind) ind.remove();
}

function logout() {
  location.reload();
}
</script>
</body>
</html>
